spring.datasource.url=jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true   # <-- ESSENCIAL: garante que data.sql rode após as tabelas criadas

careplus.jwt.secret=chave_teste_super_secreta_para_testes_32chars
careplus.jwt.expiration-ms=86400000

logging.level.org.springframework.security=DEBUG
logging.level.com.br.careplus=DEBUG

spring.sql.init.mode=always